# git-cliff configuration — generates CHANGELOG.md and release notes from conventional commits.
# https://git-cliff.org

[changelog]
header = """
# Changelog\n
All notable changes to Tic are documented here.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  # v0.4.0 image work merged unsquashed: leave out experiments that were reverted or replaced before
  # release, and fixes to bugs that never shipped, so the notes describe what actually shipped.
  { sha = "3c681c33d08dd28ca99571061fe2ecbbee09d75b", skip = true },
  { sha = "0071728d2e6e07ab68ff5f645bede2ec5d270b7d", skip = true },
  { sha = "0698f90588ba9e5bed413680f4b1ac1b34806b3c", skip = true },
  { sha = "5cfd3c43bcb2a1c62143bf5bcea86bb31a4a85fd", skip = true },
  { sha = "3a70c13753d50f13dedc4a005541f36e0384d896", skip = true },
  { sha = "b072622509f18d8494b383b360e1ce81351c4a39", skip = true },
  { sha = "1440563ed24b7f4a70fc38ebbfb8761750b8eda6", skip = true },
  { sha = "54afbcee9dba3be7599c1ccd22f46e9d11eb047d", skip = true },
  # The landing site (site/) deploys on its own (Cloudflare, from main): its changes aren't part of an
  # app release, so they stay out of the release notes, CHANGELOG.md and the in-app "what's new".
  { message = "^[a-z]+\\(site\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { body = ".*security", group = "<!-- 3 -->Security" },
  # Release notes and CHANGELOG.md list only what users notice (the website's "What's new" filters the
  # same groups): docs, chores, CI, build, refactors, styling, tests and reverts are left out.
  { message = "^(docs?|chore|ci|build|refactor|style|test|revert)", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
